[package]
name = "splat-rs"
version = "0.1.0"
edition = "2021"
description = "Render 3D Gaussian Splat files to PNG with wgpu"

[dependencies]
wgpu = "22"
ply-rs = "0.1"
clap = { version = "4", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
