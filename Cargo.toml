[package]
name = "splat-render-rs"
version = "0.1.0"
edition = "2021"
description = "Render 3D Gaussian Splat files to PNG with wgpu"

[lib]
name = "splat_render_rs"
path = "src/lib.rs"

[[bin]]
name = "splat-render-rs"
path = "src/bin/splat-render-rs.rs"

[dependencies]
wgpu = "22"
ply-rs = "0.1"
glam = { version = "0.29", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
