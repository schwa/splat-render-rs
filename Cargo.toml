[package]
name = "splat-render-rs"
version = "0.1.0"
edition = "2021"
description = "Render 3D Gaussian Splat files to PNG with wgpu"

[lib]
name = "splat_render_rs"
path = "src/lib.rs"

[[bin]]
name = "splat-render-rs"
path = "src/bin/splat-render-rs.rs"

[dependencies]
wgpu = "30"
ply-rs = "0.1"
glam = { version = "0.29", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1.1.10"
ruzstd = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
half = "2.7.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
